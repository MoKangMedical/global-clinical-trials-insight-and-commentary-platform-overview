# Render部署配置
# 文件: render.yaml

services:
  # 后端API服务
  - type: web
    name: clinical-trials-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: |
      pip install -r requirements.txt
    startCommand: |
      python src/main.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DATABASE_URL
        value: "sqlite:///clinical_trials.db"
    healthCheckPath: /health

  # 前端静态站点
  - type: static_site
    name: clinical-trials-frontend
    runtime: static
    region: oregon
    plan: free
    buildCommand: |
      npm install
      npm run build
    staticPublishPath: ./out
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://clinical-trials-api.onrender.com
